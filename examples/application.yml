apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  namespace: multiportale-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-web
  template:
    metadata:
      labels:
        app: portal-web
    spec:
      containers:
        - name: web
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portal-web
  namespace: multiportale-dev
spec:
  type: ClusterIP
  selector:
    app: portal-web
  ports:
    - name: http
      port: 80
      targetPort: http
